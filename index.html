    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        popYellow: '#FFD166',
                        popPink: '#FF85A1',
                        popPurple: '#B185DB',
                        popBlue: '#70D6FF',
                        popGreen: '#06D6A0',

    <style>
        body {
            background-color: #FFF9F2;
            background-image: radial-gradient(#ffd166 0.75px, transparent 0.75px), radial-gradient(#ff85a1 0.75px, #fff9f2 0.75px);
            background-size: 30px 30px;

</head>
<body class="min-h-screen pb-12 selection:bg-popPink selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // 音效產生器 (簡單的 Web Audio API)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                        noteGain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
                        noteGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.08 + 0.2);
                        noteOsc.start(ctx.currentTime + idx * 0.08);
                        noteOsc.stop(ctx.currentTime + idx * 0.08 + 0.2);
                    });
                } else if (type === 'catch') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        };

        // 認知偏誤怪獸資料庫
        const MONSTERS = [
            {
                id: 'all_or_nothing',
                name: '黑白極端怪',
                type: '全有全無思考 (All-or-Nothing)',
                icon: 'fa-yin-yang',
                color: 'bg-purple-100 text-purple-600 border-purple-400',
                quote: '「這次簡報沒有100分，我就是個徹底的失敗者！」',
                description: '把事情只分成「完美」與「廢柴」，忽視中間廣闊的灰色地帶與努力過程。',
                antidote: '💡 認知解藥：世界不是非黑即白，練習尋找「70分的價值」與「經驗積累」。'
            },
            {
                id: 'catastrophizing',
                name: '末日災難怪',
                type: '災難化思考 (Catastrophizing)',
                icon: 'fa-volcano',
                color: 'bg-red-100 text-red-600 border-red-400',
                quote: '「主管剛才眼神不對，我一定會被開除，然後繳不出房租露宿街頭！」',
                description: '抓住一個微小細節，在腦海中自編自導最恐怖的連鎖毀滅劇本。',
                antidote: '💡 認知解藥：問自己「最可能發生的實際情況是什麼？就算最壞發生，我有什麼應對方案？」'
            },
            {
                id: 'personalization',
                name: '受害甩鍋怪',
                type: '過度歸因與怨天尤人 (Personalization & External Blame)',
                icon: 'fa-meteor',
                color: 'bg-amber-100 text-amber-700 border-amber-400',
                quote: '「今天下雨都是老天針對我！大家都在跟我作對，我什麼都控制不了！」',
                description: '把所有不順心歸咎於外界陰謀或命運，讓自己陷於「無能為力的被害者」深淵。',
                antidote: '💡 認知解藥：區分「天氣/別人的行為」（不可控）與「我的反應/行動」（可控）。'
            },
            {
                id: 'mind_reading',
                name: '猜心通靈怪',
                type: '讀心術 (Mind Reading)',
                icon: 'fa-hat-wizard',
                color: 'bg-blue-100 text-blue-600 border-blue-400',
                quote: '「他剛才沒回我訊息，一定是在心裡討厭我、覺得我很煩！」',
                description: '在缺乏客觀證據的情況下，擅自認定別人對自己有負面評價或敵意。',
                antidote: '💡 認知解藥：把「我的揣測」跟「客觀事實」分開。沒回訊息可能只是他在忙或沒看到！'
            },
            {
                id: 'should_statements',
                name: '應該暴君怪',
                type: '應該/必須魔咒 (Should Statements)',
                icon: 'fa-gavel',
                color: 'bg-emerald-100 text-emerald-700 border-emerald-400',
                quote: '「世界應該對我公平！大家必須照我的規則做事！我絕對不能犯錯！」',
                description: '用剛硬不合理的「應該」綁架自己與他人，只要現實不符合就引發巨大憤怒與挫折。',
                antidote: '💡 認知解藥：把「應該/必須」替換成「如果能...會很好，但如果沒有，我也能彈性應對」。'
            }
        ];

        // 控制圈分類預設題目
        const INITIAL_CIRCLE_ITEMS = [
            { id: 1, text: '今天的連降大雨', category: 'uncontrollable', label: '完全不可控' },
            { id: 2, text: '主管脾氣與陰晴不定', category: 'uncontrollable', label: '完全不可控' },
            { id: 3, text: '我今天幾點睡覺與飲食選擇', category: 'controllable', label: '100%可控' },
            { id: 4, text: '面對批評時我的回應方式', category: 'controllable', label: '100%可控' },
            { id: 5, text: '過去已經發生的失誤', category: 'uncontrollable', label: '完全不可控' },
            { id: 6, text: '我對自己說話的內在語氣', category: 'controllable', label: '100%可控' },
            { id: 7, text: '同事對我的主觀印象', category: 'influence', label: '可影響但不可控' },
            { id: 8, text: '團隊專案的最終銷售業績', category: 'influence', label: '可影響但不可控' }
        ];

        function App() {
            const [activeTab, setActiveTab] = React.useState('monsters');
            const [xp, setXp] = React.useState(20);
            const [caughtMonsters, setCaughtMonsters] = React.useState([]);
            
            // ABC 實驗室 State
            const [abcA, setAbcA] = React.useState('');
            const [abcB, setAbcB] = React.useState('');
            const [abcC, setAbcC] = React.useState('');
            const [abcD, setAbcD] = React.useState('');
            const [abcE, setAbcE] = React.useState('');
            const [abcSubmitted, setAbcSubmitted] = React.useState(false);

            // 控制圈 State
            const [circleItems, setCircleItems] = React.useState(INITIAL_CIRCLE_ITEMS);
            const [userSorted, setUserSorted] = React.useState({});
            const [circleScore, setCircleScore] = React.useState(null);

            // Gemini AI 心靈教練 State
            const [userThought, setUserThought] = React.useState('');
            const [aiLoading, setAiLoading] = React.useState(false);
            const [aiResponse, setAiResponse] = React.useState(null);
            const [apiKey, setApiKey] = React.useState('');

            // 五感著陸 State
            const [groundingStep, setGroundingStep] = React.useState(5);
            const [groundingInputs, setGroundingInputs] = React.useState({ 5: '', 4: '', 3: '', 2: '', 1: '' });
            const [gratitudeLog, setGratitudeLog] = React.useState(['今天喝了一杯熱茶', '看見路邊漂亮的野花']);
            const [newGratitude, setNewGratitude] = React.useState('');

            const addXP = (amount) => {
                setXp(prev => {
                    const next = prev + amount;
                    if (Math.floor(next / 100) > Math.floor(prev / 100)) {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        playSound('success');
                    }
                    return next;
                });
            };

            // 捕捉小怪獸
            const handleCatchMonster = (id) => {
                if (!caughtMonsters.includes(id)) {
                    setCaughtMonsters([...caughtMonsters, id]);
                    addXP(30);
                    playSound('catch');
                }
            };

            // 控制圈分類互動
            const handleSortCircleItem = (itemId, chosenCategory) => {
                setUserSorted(prev => ({ ...prev, [itemId]: chosenCategory }));
                playSound('pop');
            };

            const checkCircleScore = () => {
                let correct = 0;
                circleItems.forEach(item => {
                    if (userSorted[item.id] === item.category) {
                        correct++;
                    }
                });
                setCircleScore(correct);
                if (correct === circleItems.length) {
                    addXP(50);
                    confetti({ particleCount: 80, spread: 60 });
                    playSound('success');
                }
            };

            // ABC 實驗室提交
            const handleAbcSubmit = (e) => {
                e.preventDefault();
                if (!abcA || !abcB || !abcC || !abcD || !abcE) return;
                setAbcSubmitted(true);
                addXP(40);
                confetti({ particleCount: 70, spread: 60 });
                playSound('success');
            };

            // Gemini API 呼叫 (Cognitive Reframing Coach)
            const handleAiAnalyze = async () => {
                if (!userThought.trim()) return;
                setAiLoading(true);
                setAiResponse(null);

                const systemInstruction = `你是一位專業、有同理心且具備扎實認知行為治療 (CBT) 理論的「好心情心靈教練」。
你的任務是幫使用者剖析他們「怨天尤人」或「慣性負面」的想法。
請用極具親和力、溫暖且易懂的語言回答，包含以下結構：
1. 【心靈擁抱】：給予同理與傾聽，不批判情緒。
2. 【抓出心魔怪獸】：標註這個想法對應的認知偏誤（如：災難化、黑白思考、受害過度歸因、讀心術等）。
3. 【認知重構三步曲】：
   - 觀點 A (現實檢驗)：這個想法有哪些盲點或被誇大的地方？
   - 觀點 B (掌控權轉移)：什麼是真正屬於使用者「可控」的行動？（擺脫怨天尤人）
   - 觀點 C (新彈性信念)：句式改寫成溫柔而客觀的新心態。
請輸出清晰簡明的 JSON 格式（包含 title, monster, empathy, perspectiveA, perspectiveB, perspectiveC, affirmativeQuote）。`;

                const userPrompt = `我的負面想法/抱怨是：「${userThought}」`;

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                try {
                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) throw new Error('API Request Failed');
                    const data = await res.json();
                    const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    const parsed = JSON.parse(jsonText);
                    setAiResponse(parsed);
                    addXP(50);
                    confetti({ particleCount: 90, spread: 70 });
                    playSound('success');
                } catch (err) {
                    console.warn('API error, falling back to smart local simulation:', err);
                    // 備用在地化智能轉念邏輯
                    setTimeout(() => {
                        setAiResponse({
                            title: '轉念重構完成 ✨',
                            monster: '「受害歸因與災難化」雙重怪獸',
                            empathy: '聽起來你現在真的感到很無力與受挫，這種「為什麼又是我發生這種事」的感覺非常不好受。',
                            perspectiveA: '【客觀檢驗】我們常把一時的不順心，擴大解釋成「命運在針對我」，但事實上事件往往是許多客觀因素交織的結果，並非個人的詛咒。',
                            perspectiveB: '【重獲主導權】雖然我們無法控制事情怎麼發生（不可控圈），但我們100%擁有「如何看待與應對」的選擇權（可控圈）。',
                            perspectiveC: '【彈性新信念】「這件事確實很棘手，但我有能力處理我的情緒，並專注在現在能改善的微小下一步。」',
                            affirmativeQuote: '「我不必控制風向，但我隨時可以調整船帆。」'
                        });
                        addXP(40);
                        playSound('success');
                    }, 1200);
                } finally {
                    setAiLoading(false);
                }
            };

            const level = Math.floor(xp / 100) + 1;
            const progress = xp % 100;

            return (
                <div class="max-w-4xl mx-auto px-4 pt-6">
                    {/* Header Banner */}
                    <header class="bg-cardBg border-4 border-slate-800 rounded-3xl p-6 mb-6 shadow-pop-lg relative overflow-hidden">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <div class="w-16 h-16 bg-popYellow border-4 border-slate-800 rounded-2xl flex items-center justify-center text-3xl shadow-pop bouncy">
                                    🐣
                                </div>
                                <div>
                                    <h1 class="text-2xl md:text-3xl font-black tracking-wide text-slate-800">
                                        ✨ 好心情養成班 ✨
                                    </h1>
                                    <p class="text-xs md:text-sm font-bold text-slate-500 mt-1">
                                        用扎實「認知心理學 (CBT)」翻轉慣性抱怨與負面念頭
                                    </p>
                                </div>
                            </div>
                            
                            {/* Gamification Level Box */}
                            <div class="w-full md:w-auto bg-amber-50 border-3 border-slate-800 p-3 rounded-2xl flex items-center justify-between md:justify-end gap-4 shadow-pop">
                                <div>
                                    <div class="flex justify-between items-center text-xs font-black mb-1">
                                        <span>轉念大師 Level {level}</span>
                                        <span class="text-popPink">{progress}/100 XP</span>
                                    </div>
                                    <div class="w-36 h-3 bg-slate-200 border-2 border-slate-800 rounded-full overflow-hidden">
                                        <div 
                                            class="h-full bg-popPink transition-all duration-500" 
                                            style={{ width: `${progress}%` }}
                                        ></div>
                                    </div>
                                </div>
                                <div class="text-2xl">🏆</div>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <nav class="flex flex-wrap gap-2 mt-6 pt-4 border-t-2 border-slate-200">
                            {[
                                { id: 'monsters', name: '👾 識破怪獸', desc: '認知偏誤' },
                                { id: 'abc', name: '💣 ABC 實驗室', desc: '情緒拆彈' },
                                { id: 'control', name: '⭕ 控制圈劃分', desc: '擺脫抱怨' },
                                { id: 'ai_coach', name: '🤖 AI 心靈教練', desc: '即時轉念' },
                                { id: 'grounding', name: '🧘 五感著陸', desc: '正念微習慣' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => { setActiveTab(tab.id); playSound('pop'); }}
                                    class={`flex-1 min-w-[120px] py-2 px-3 rounded-xl border-3 border-slate-800 font-black text-sm transition-all bouncy shadow-pop ${
                                        activeTab === tab.id 
                                        ? 'bg-popYellow text-slate-900 -translate-y-1' 
                                        : 'bg-white hover:bg-slate-50 text-slate-600'
                                    }`}
                                >
                                    <div>{tab.name}</div>
                                    <div class="text-[10px] font-medium opacity-80">{tab.desc}</div>
                                </button>
                            ))}
                        </nav>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main>
                        {/* TAB 1: 思考怪獸卡牌 */}
                        {activeTab === 'monsters' && (
                            <section class="space-y-6">
                                <div class="bg-popPink/10 border-3 border-slate-800 p-4 rounded-2xl flex items-start gap-3">
                                    <div class="text-2xl">💡</div>
                                    <div>
                                        <h3 class="font-bold text-slate-800">什麼是「認知偏誤 (Cognitive Distortions)」？</h3>
                                        <p class="text-xs text-slate-600 mt-1 leading-relaxed">
                                            大腦為了省力，常會自動套用「捷徑思考」，卻不小心演化成思考偏誤怪獸！
                                            當我們抱怨「老天總針對我」或「我這輩子完蛋了」時，其實只是怪獸在耳邊 whisper。
                                            點擊「捉拿怪獸」並閱讀解藥，重新掌握思考自主權！
                                        </p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {MONSTERS.map(m => {
                                        const isCaught = caughtMonsters.includes(m.id);
                                        return (
                                            <div 
                                                key={m.id} 
                                                class={`bg-cardBg border-4 border-slate-800 rounded-3xl p-5 shadow-pop transition-all relative overflow-hidden flex flex-col justify-between ${
                                                    isCaught ? 'ring-4 ring-popGreen/50' : ''
                                                }`}
                                            >
                                                <div>
                                                    <div class="flex items-center justify-between mb-3">
                                                        <span class={`px-3 py-1 rounded-full border-2 border-slate-800 text-xs font-black ${m.color}`}>
                                                            <i class={`fas ${m.icon} mr-1`}></i> {m.name}
                                                        </span>
                                                        {isCaught ? (
                                                            <span class="bg-popGreen text-slate-900 border-2 border-slate-800 text-xs px-2 py-0.5 rounded-md font-bold">
                                                                <i class="fas fa-check-circle"></i> 已捉拿
                                                            </span>
                                                        ) : (
                                                            <span class="text-xs font-bold text-slate-400">未封印</span>
                                                        )}
                                                    </div>

                                                    <h4 class="text-sm font-extrabold text-slate-500 mb-2">{m.type}</h4>
                                                    
                                                    <blockquote class="bg-amber-50 border-l-4 border-popYellow p-3 rounded-r-xl italic text-xs text-slate-700 mb-3 font-medium">
                                                        {m.quote}
                                                    </blockquote>

                                                    <p class="text-xs text-slate-600 leading-relaxed mb-4">
                                                        {m.description}
                                                    </p>
                                                </div>

                                                <div class="mt-2 pt-3 border-t-2 border-slate-100">
                                                    <p class="text-xs font-bold text-slate-800 mb-3">
                                                        {m.antidote}
                                                    </p>
                                                    <button
                                                        onClick={() => handleCatchMonster(m.id)}
